name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Install D-Bus headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: plugin
          persist-credentials: false
      - name: Check out Omarchy's plugin validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: omacom/omarchy
          ref: 393a43d469d2256f517cdce3b4f74115daed929a
          path: omarchy
          sparse-checkout: bin/omarchy-plugin-validate
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Validate plugin
        run: bash omarchy/bin/omarchy-plugin-validate plugin
      - name: Check manifest and daemon versions match
        run: |
          manifest=$(jq -r .version plugin/manifest.json)
          cargo=$(grep -m1 '^version = ' plugin/backend/Cargo.toml | cut -d'"' -f2)
          if [[ $manifest != "$cargo" ]]; then
            echo "manifest.json version $manifest differs from backend/Cargo.toml version $cargo" >&2
            exit 1
          fi
      - name: Exercise guard-safe removal
        run: bash plugin/tests/uninstall.sh
