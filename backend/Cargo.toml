[package]
name = "airpodsd"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "Identity-bound, in-ear-only AirPods daemon for Omarchy"

[dependencies]
aes = "0.8.4"
anyhow = "1.0"
dbus = "0.9"
dbus-tokio = "0.7"
bluer = { version = "0.17.4", features = ["bluetoothd", "l2cap"] }
fs2 = "0.4"
futures = "0.3"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal", "process"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
